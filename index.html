<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mprendergast</title>
<meta name="description" content="A running index of photographs.">
<meta name="color-scheme" content="dark light" id="color-scheme-meta">
<script>
  if (localStorage.getItem("photo-site-theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <span class="site-name">Michael Patrick Prendergast</span>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme"></button>
    <div class="header-meta">
      <span class="index-count" id="index-count">N&deg; 00</span>
      <span class="index-year">2026&mdash;</span>
    </div>
  </div>
</header>

<nav class="type-nav" id="type-nav" aria-label="Filter by section" hidden>
  <!-- populated by script.js: All / Photography / Text / Audio. Sections
       with no entries yet just fall through to the empty state. -->
</nav>

<nav class="location-nav" id="location-nav" aria-label="Filter photographs by location" hidden>
  <!-- populated by script.js: "All" plus one chip per distinct photo
       location — only shown within the Photography section -->
</nav>

<nav class="filters" id="filters" aria-label="Filter photographs by tag">
  <!-- populated by script.js: "All" plus one chip per tag used in the
       active section — hidden while the top-level section is "All" -->
</nav>

<main>
  <section class="gallery" id="gallery" aria-label="Photograph index">
    <!-- populated by script.js from photos.js -->
  </section>

  <p class="empty-state" id="empty-state" hidden>
    Nothing indexed yet.<br>
    Add a file to <code>/images</code> and register it in <code>photos.js</code>.
  </p>
</main>

<footer class="site-footer">
  <span>Philadelphia, PA</span>
  <span class="rule" aria-hidden="true"></span>
  <span>Updated as photographs are taken</span>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph view" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#10005;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photograph">&#8592;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-image" src="" alt="">
    <div class="lightbox-text" id="lightbox-text" hidden>
      <button class="plain-text-toggle" id="plain-text-toggle" type="button">Plain text</button>
      <div class="lightbox-text-body" id="lightbox-text-body"></div>
    </div>
    <figcaption>
      <div class="lightbox-caption-line">
        <span class="lightbox-index" id="lightbox-index"></span>
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-meta" id="lightbox-meta"></span>
      </div>
      <div class="lightbox-specs" id="lightbox-specs"></div>
    </figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photograph">&#8594;</button>
  <p class="lightbox-hint" aria-hidden="true">&larr; &rarr; Navigate &middot; Click Center to Zoom &middot; Esc Close &middot; Swipe on Touch</p>
</div>

<script src="photos.js"></script>
<script src="script.js"></script>
</body>
</html>
