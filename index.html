<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mprendergast</title>
<meta name="color-scheme" content="dark light" id="color-scheme-meta">
<link rel="icon" href="favicon.ico" sizes="16x16">
<script>
  var altTheme = localStorage.getItem("photo-site-alt");
  if (altTheme === "walnut" || altTheme === "forest" || altTheme === "mono" || altTheme === "playful") {
    document.documentElement.setAttribute("data-theme", altTheme);
  } else if (localStorage.getItem("photo-site-theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="beta.css">
</head>
<body>

<header class="site-header">
  <span class="site-name"><img class="site-name-icon" src="favicon.ico" alt="" width="16" height="16">Michael Patrick Prendergast<img class="site-name-flourish" src="images/png/name-flourish.png" alt=""></span>
  <div class="header-right">
    <nav class="site-nav" aria-label="Site pages">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="archive.html">Archive</a>
    </nav>
    <div class="header-controls">
      <div class="snow-settings">
        <button class="header-toggle" id="snow-toggle" type="button" aria-label="Toggle falling snow" aria-pressed="false">Snow</button>
        <button class="snow-settings-toggle" id="snow-settings-toggle" type="button" aria-label="Snow settings" aria-expanded="false">⌄</button>
        <div class="snow-settings-panel" id="snow-settings-panel" hidden>
          <label class="snow-settings-row">
            <span>Speed</span>
            <input type="range" id="snow-speed" min="0.1" max="2.5" step="0.1" value="0.2">
          </label>
          <label class="snow-settings-row">
            <span>Amount</span>
            <input type="range" id="snow-amount" min="0.2" max="6" step="0.1" value="1">
          </label>
          <label class="snow-settings-row">
            <span>Wind</span>
            <div class="snow-wind-track">
              <span class="snow-wind-label">L</span>
              <input type="range" id="snow-wind" min="-1" max="1" step="0.1" value="0">
              <span class="snow-wind-label">R</span>
            </div>
          </label>
        </div>
      </div>
      <span class="header-divider" aria-hidden="true"></span>
      <button class="header-toggle" id="playful-toggle" type="button" aria-label="Toggle Alt theme" aria-pressed="false">Alt</button>
      <button class="header-toggle" id="theme-toggle" type="button" aria-label="Switch theme"></button>
    </div>
  </div>
</header>

<div id="view">
<div class="beta-layout">
  <div class="beta-bg-col">
    <img class="beta-bg-image" src="images/bg/background.jpg" alt="">
  </div>

  <div class="beta-detail" id="beta-detail" hidden>
    <button class="beta-detail-close" id="beta-detail-close" type="button" aria-label="Close">&#10005;</button>
    <button class="beta-detail-image-btn" id="beta-detail-image-btn" type="button" aria-label="Open full size">
      <img id="beta-detail-image" src="" alt="">
    </button>
    <div class="beta-detail-text" id="beta-detail-text" hidden>
      <div class="beta-detail-text-body" id="beta-detail-text-body"></div>
    </div>
    <div class="beta-detail-caption">
      <span class="beta-detail-title" id="beta-detail-title"></span>
      <span class="beta-detail-meta" id="beta-detail-meta"></span>
      <span class="beta-detail-specs" id="beta-detail-specs"></span>
    </div>
  </div>

  <div class="beta-content-col">
    <div class="nav-row">
      <nav class="type-nav" id="beta-type-nav" aria-label="Filter by section"></nav>
      <div class="nav-utility">
        <input class="search-input" id="beta-search-input" type="search" placeholder="Search" aria-label="Search everything on the site">
        <button class="shuffle-btn" id="beta-random-btn" type="button" aria-label="Open a random entry">Random</button>
      </div>
    </div>
    <nav class="location-nav" id="beta-location-nav" aria-label="Filter photographs by location"></nav>
    <nav class="filters" id="beta-filters" aria-label="Filter photographs by tag"></nav>
    <div class="gallery beta-gallery" id="beta-gallery" aria-label="Photograph index"></div>
    <p class="empty-state" id="beta-empty-state" hidden>Nothing indexed yet.</p>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph view" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#10005;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photograph">&#8592;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-image" src="" alt="">
    <figcaption>
      <div class="lightbox-caption-line">
        <span class="lightbox-index" id="lightbox-index"></span>
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-meta" id="lightbox-meta"></span>
      </div>
      <div class="lightbox-specs" id="lightbox-specs"></div>
    </figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photograph">&#8594;</button>
  <p class="lightbox-hint" aria-hidden="true">&larr; &rarr; Navigate &middot; Click Center to Zoom &middot; Esc Close &middot; Swipe on Touch</p>
</div>
</div>

<footer class="site-footer">
  <span>Philadelphia, PA</span>
  <span class="rule" aria-hidden="true"></span>
  <span id="site-stats"></span>
  <span class="rule" aria-hidden="true"></span>
  <span>Updated as photographs are taken</span>
</footer>

<script src="photos.js"></script>
<script src="script.js"></script>
<script src="archive.js"></script>
<script src="beta.js"></script>
<script src="theme.js"></script>
<script src="snow.js"></script>
<script src="stats.js"></script>
<script src="player.js"></script>
<script src="router.js"></script>
</body>
</html>
