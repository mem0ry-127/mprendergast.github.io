<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photographs — an index</title>
<meta name="description" content="A running index of photographs.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grid-overlay" aria-hidden="true">
  <div></div><div></div><div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div><div></div><div></div>
</div>

<header class="site-header">
  <div class="wordmark">
    <span class="wordmark-line1">PHOTOGRAPHS</span>
    <span class="wordmark-line2">an index, kept as taken</span>
  </div>
  <div class="header-meta">
    <span class="index-count" id="index-count">N&deg; 00</span>
    <span class="index-year">2026&mdash;</span>
  </div>
</header>

<main>
  <section class="gallery" id="gallery" aria-label="Photograph index">
    <!-- populated by script.js from photos.js -->
  </section>

  <p class="empty-state" id="empty-state" hidden>
    Nothing indexed yet.<br>
    Add a file to <code>/images</code> and register it in <code>photos.js</code>.
  </p>
</main>

<footer class="site-footer">
  <span>Philadelphia, PA</span>
  <span class="rule" aria-hidden="true"></span>
  <span>Updated as photographs are taken</span>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph view" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#10005;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photograph">&#8592;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-image" src="" alt="">
    <figcaption>
      <span class="lightbox-index" id="lightbox-index"></span>
      <span class="lightbox-title" id="lightbox-title"></span>
      <span class="lightbox-meta" id="lightbox-meta"></span>
    </figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photograph">&#8594;</button>
</div>

<script src="photos.js"></script>
<script src="script.js"></script>
</body>
</html>
