<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive — mprendergast</title>
<meta name="description" content="A chronological index of everything on this site.">
<meta name="color-scheme" content="dark light" id="color-scheme-meta">
<link rel="icon" href="favicon.ico" sizes="16x16">
<script>
  if (localStorage.getItem("photo-site-playful") === "on") {
    document.documentElement.setAttribute("data-theme", "playful");
  } else if (localStorage.getItem("photo-site-theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <span class="site-name"><img class="site-name-icon" src="favicon.ico" alt="" width="16" height="16">Michael Patrick Prendergast</span>
  <div class="header-right">
    <nav class="site-nav" aria-label="Site pages">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="archive.html" aria-current="page">Archive</a>
    </nav>
    <div class="header-controls">
      <div class="snow-settings">
        <button class="header-toggle" id="snow-toggle" type="button" aria-label="Toggle falling snow" aria-pressed="false">Snow</button>
        <button class="snow-settings-toggle" id="snow-settings-toggle" type="button" aria-label="Snow settings" aria-expanded="false">⌄</button>
        <div class="snow-settings-panel" id="snow-settings-panel" hidden>
          <label class="snow-settings-row">
            <span>Speed</span>
            <input type="range" id="snow-speed" min="0.3" max="2.5" step="0.1" value="1">
          </label>
          <label class="snow-settings-row">
            <span>Amount</span>
            <input type="range" id="snow-amount" min="0.2" max="6" step="0.1" value="1">
          </label>
          <label class="snow-settings-row">
            <span>Wind</span>
            <div class="snow-wind-track">
              <span class="snow-wind-label">L</span>
              <input type="range" id="snow-wind" min="-1" max="1" step="0.1" value="0">
              <span class="snow-wind-label">R</span>
            </div>
          </label>
        </div>
      </div>
      <span class="header-divider" aria-hidden="true"></span>
      <button class="header-toggle" id="playful-toggle" type="button" aria-label="Toggle Alt theme" aria-pressed="false">Alt</button>
      <button class="header-toggle" id="theme-toggle" type="button" aria-label="Switch theme"></button>
    </div>
  </div>
</header>

<div id="view">
<main class="archive-main">
  <div id="archive-container"></div>
</main>
</div>

<footer class="site-footer">
  <span>Philadelphia, PA</span>
  <span class="rule" aria-hidden="true"></span>
  <span id="site-stats"></span>
  <span class="rule" aria-hidden="true"></span>
  <span>Updated as photographs are taken</span>
</footer>

<script src="photos.js"></script>
<script src="script.js"></script>
<script src="archive.js"></script>
<script src="theme.js"></script>
<script src="snow.js"></script>
<script src="stats.js"></script>
<script src="player.js"></script>
<script src="router.js"></script>
</body>
</html>
